[project]
name = "uv-build-system-repro"
version = "0.1.0"
requires-python = ">=3.11"
# torch depends on setuptools at runtime, so it lands in uv.lock
dependencies = ["torch>=2.0"]

[build-system]
# the same package is also a build requirement
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
